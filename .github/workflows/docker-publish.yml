name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
    paths:
      - 'src/ResidencyRoll.Api/**'
      - 'src/ResidencyRoll.Web/**'
      - 'src/ResidencyRoll.Shared/**'
      - 'Dockerfile'
      - 'Dockerfile.api'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: kcr.kinsac.com
  IMAGE_NAME: residency-roll

jobs:
  build-and-push:
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    strategy:
      matrix:
        service:
          - name: web
            file: ./Dockerfile
            image_suffix: web
          - name: api
            file: ./Dockerfile.api
            image_suffix: api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set version
        id: version
        run: |
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "VERSION=1.0.${{ github.run_number }}-dev" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to private container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.image_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.service.file }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            SOURCE_REVISION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Actions mail is failure-only for every workflow, and that setting cannot
  # be limited to this one. An issue comment still notifies the author.
  confirm-push:
    name: Confirm the registry push
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Tell the author both images were pushed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            channel=latest
          elif [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            channel=dev
          else
            channel="$GITHUB_REF_NAME"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          web="${REGISTRY}/${IMAGE_NAME}/web"
          api="${REGISTRY}/${IMAGE_NAME}/api"
          title="Docker images pushed to ${REGISTRY}"
          body=$(printf '@%s Both images were pushed.\n\n- `%s:%s`\n- `%s:%s`\n- `%s:%s`\n- `%s:%s`\n\n%s\n' \
            "$GITHUB_ACTOR" \
            "$web" "$channel" "$web" "$VERSION" \
            "$api" "$channel" "$api" "$VERSION" \
            "$run_url")
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          number=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq "[.[] | select(.pull_request == null) | select(.title == \"${title}\")][0].number")
          if [ -z "$number" ] || [ "$number" = "null" ]; then
            gh issue create --title "$title" --assignee "$GITHUB_ACTOR" --body "$body"
          else
            gh issue comment "$number" --body "$body"
          fi
