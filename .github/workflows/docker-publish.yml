name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
    paths:
      - 'src/ResidencyRoll.Api/**'
      - 'src/ResidencyRoll.Web/**'
      - 'src/ResidencyRoll.Shared/**'
      - 'Dockerfile'
      - 'Dockerfile.api'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: kcr.kinsac.com
  IMAGE_NAME: residency-roll

jobs:
  build-and-push:
    strategy:
      matrix:
        service:
          - name: web
            file: ./Dockerfile
            image_suffix: web
          - name: api
            file: ./Dockerfile.api
            image_suffix: api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set version
        id: version
        run: |
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "VERSION=1.0.${{ github.run_number }}-dev" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to private container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.image_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.service.file }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
