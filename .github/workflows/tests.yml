name: CI Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'src/ResidencyRoll.sln'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'src/ResidencyRoll.sln'
      - '.github/workflows/tests.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ResidencyRoll.sln

      - name: Build
        run: dotnet build src/ResidencyRoll.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/ResidencyRoll.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ResidencyRoll.Web/ClientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ResidencyRoll.Web/ClientApp/package-lock.json

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compose the API and web host
        run: docker compose -f docker-compose.build.yml up -d --build
        env:
          OIDC_ENABLED: "false"
          OIDC_CLIENT_SECRET: ci-placeholder

      - name: Wait for the web host
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/bff/user >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.build.yml logs
          exit 1

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ResidencyRoll.Web/ClientApp/package-lock.json

      - name: Install Playwright
        working-directory: src/ResidencyRoll.Web/ClientApp
        run: npm ci && npx playwright install --with-deps chromium

      - name: Smoke
        working-directory: src/ResidencyRoll.Web/ClientApp
        run: npx playwright test e2e/smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.build.yml down -v
