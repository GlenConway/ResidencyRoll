name: CI Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'src/ResidencyRoll.sln'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'src/ResidencyRoll.sln'
      - '.github/workflows/tests.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ResidencyRoll.sln

      - name: Build
        run: dotnet build src/ResidencyRoll.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/ResidencyRoll.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ResidencyRoll.Web/ClientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ResidencyRoll.Web/ClientApp/package-lock.json

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
